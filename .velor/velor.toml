# Velor Agent CLI Configuration
#
# This config provides defaults and templates for running autonomous Claude agents.
# Customise the values below to suit your project's needs.

[defaults]
# Communication protocol: "subprocess" (default) or "acp"
protocol = "subprocess"

# Default permission mode for Claude (accepts edit suggestions automatically)
permission_mode = "acceptEdits"

# Claude binary to use (e.g. "claude", "claude-glm", "claude-acp", etc.)
binary = "claude-glm"

# ACP-specific configuration (only used when protocol = "acp")
[defaults.acp]
api_key_env = "ZAI_API_KEY"
permission_mode = "allow"
persist_adapter = true

# Default progress file for tracking work
progress_path = ".velor/progress.md"

# Default iterations for auto-mode
iterations = 50

# Default prompt name
prompt = "once"

# Completion token that signals plan completion
complete_token = "<promise>COMPLETE</promise>"

# Global variables available to all prompt templates
[vars]
# Project metadata - customise these for your project
project_name = "My Project"
repo_name = "my-repo"

# Tech stack - customise for your project
# frontend = "SvelteKit 5 + Skeleton.dev UI"
# backend = "Rust (Axum + utoipa + SeaORM)"
# database = "PostgreSQL 16+ with pgvector"

# Important file paths - customise for your project
pin = "AGENTS.md" # Pinned information to the start of each agent
plan = "~/.claude/plans/vast-hugging-puffin.md"
rust_rules_file = ".agents/rules/rust.mdc"
rules_dir = ".agents/rules/"

# Development commands - customise for your project
# test_rust_cmd = "cargo test"
check_cmd = "just check"
# lint_rust_cmd = "cargo clippy"

# Named prompt templates
[prompts]
# Simple test prompt for ACP
acp-test = """
You are connected via the Agent Control Protocol (ACP).
Please respond with a brief message confirming:
1. You received this message
2. What model you're using
3. A fun fact about Rust

Keep it brief - 2-3 sentences max.
"""

# Test prompt to verify glob-based rule injection
test-glob-injection = """
Read the file CLAUDE.md and tell me what it says about the repository.
This test verifies that glob-based rule injection works when you read Markdown files.
"""

# Single-shot prompt for one-off tasks
once = """
1. study {{pin}}.
2. study {{plan}} and select the most important task to do next. Work ONLY on that ONE task.
3. study {{rust_rules_file}}
IMPORTANT:
- Author property tests, snapshot tests, and/or unit tests (whichever combination you think is best)
- After making the changes run the tests
- When the tests pass and {{check_cmd}} runs without errors or warnings, commit (no push) the changes.
- Update the implementation plan when the task is done.
- Update any other spec files if necessary.

If, while implementing the feature, you notice the plan is complete, output exactly this text: {{complete_token}}
"""

# Auto-mode prompt for iterative development with implement-plan
implement-plan = """
1. study {{pin}}.
2. study {{plan}} and select the most important task to do next. Work ONLY on that ONE task. This should be the one YOU decide has the highest priority, not necessarily the first thing you see.
3. study {{rust_rules_file}}
4. If, while implementing the feature, you notice the entire plan is complete, with all best-practices followed from end to end, double-check the entire plan's implementation for any possible improvements (don't trust the progress file, double-check everything), and if it's really completely and perfectly implemented, then output exactly this text: "{{complete_token}}". Otherwise, DO NOT OUTPUT {{complete_token}}, but instead just stop.
IMPORTANT:
- Author property tests, snapshot tests, and/or unit tests (whichever combination of the 3 you think is best)
- After making the changes to the files run the tests
- When the task done, tests pass and {{check_cmd}} runs without errors or warnings, create a detailed commit (don't push) your work (only).
- Update any other spec files if necessary.
- Leave a summary of your progress at {{plan}}.progress.md.
"""

[conversation_db]
path = ".velor/conversations.db"
encrypt_content = false
encryption_key_env = "VELOR_CONVERSATIONS_KEY"
retention_days = 0

[plan]
specs_dir = "specs"
plan_max_iterations = 10
openai_api_key_env = "OPENAI_API_KEY"
openai_model = "gpt-5.2"

# Rules system configuration
[rules]
enabled = true
directory = ".agents/rules"
max_mid_iteration_injections = 2
intelligent_selection = false
intelligent_selection_max_rules = 5

# Notifications configuration
[notifications]
enabled = true
notify_on_success = true
notify_on_max_iterations = true
notify_on_failure = true
output_preview_chars = 500

[notifications.macos]
enabled = true
sound = "default"

[notifications.telegram]
enabled = true
bot_token_env = "TELEGRAM_BOT_TOKEN"
chat_id = "-1003873464939"  # e.g., "-1001234567890"

# Server runtime configuration (`vel serve`)
[serve]
enabled = true
poll_timeout_secs = 10
poll_limit = 50
include_backlog = false
max_requests_per_minute = 20
max_concurrent_tasks = 2
default_timeout_secs = 1800
media_dir = ".velor/telegram-media"

[serve.streaming]
enabled = true
edit_throttle_secs = 1
max_message_chars = 3600
flush_on_milestones = true

[serve.telegram]
# Optional additional allowlist entries (chat_id from notifications.telegram is always included).
allowed_chat_ids = []
# Optional user-level allowlist. Empty means "any user within allowed chats".
allowed_user_ids = []
allow_channel_posts = true

[serve.attachments]
enabled = true
allow_photos = true
allow_documents = true
max_download_bytes = 20971520
keep_files = false
allowed_document_mime_prefixes = ["image/", "text/", "application/pdf", "application/json", "application/xml"]

[serve.session_resume]
enabled = true
store_path = ".velor/telegram-session-bindings.json"
max_bindings = 10000

[serve.routing]
require_prefix = true
default_runner = "codex-gpt-5-4"

[serve.routing.prefixes]
"opus:" = "claude-opus-4-6"
"sonnet:" = "claude-sonnet-4-6"
"5.3-codex:" = "codex-gpt-5-3-codex"
"5.3:" = "codex-gpt-5-3-codex"
"5.4:" = "codex-gpt-5-4"
"glm5.1:" = "glm-5-1"
"5.1:" = "glm-5-1"
"codex:" = "codex-gpt-5-4"

[serve.runners."claude-opus-4-6"]
description = "Claude Opus 4.6"
kind = "claude"
binary = "claude"
model = "claude-opus-4-6"
permission_mode = "acceptEdits"
timeout_secs = 1800
supports_attachments = false
supports_streaming = true
supports_session_resume = true

[serve.runners."claude-sonnet-4-6"]
description = "Claude Sonnet 4.6"
kind = "claude"
binary = "claude"
model = "claude-sonnet-4-6"
permission_mode = "acceptEdits"
timeout_secs = 1800
supports_attachments = false
supports_streaming = true
supports_session_resume = true

[serve.runners."codex-gpt-5-3-codex"]
description = "Codex GPT-5.3 Codex"
kind = "codex"
binary = "codex"
model = "gpt-5.3-codex"
permission_mode = "acceptEdits"
timeout_secs = 1800
supports_attachments = true
supports_streaming = true
supports_session_resume = true
[serve.runners."codex-gpt-5-3-codex".codex]
full_auto = true
sandbox = "workspace-write"
skip_git_repo_check = false
progress_cursor = false
reasoning_effort = "xhigh"

[serve.runners."codex-gpt-5-4"]
description = "Codex GPT-5.4"
kind = "codex"
binary = "codex"
model = "gpt-5.4"
permission_mode = "acceptEdits"
timeout_secs = 1800
supports_attachments = true
supports_streaming = true
supports_session_resume = true
[serve.runners."codex-gpt-5-4".codex]
full_auto = true
sandbox = "workspace-write"
skip_git_repo_check = false
progress_cursor = false

[serve.runners."glm-5-1"]
description = "GLM 5.1 via /Users/liam/bin/glm5.1"
kind = "claude"
binary = "/Users/liam/bin/glm5.1"
model = "glm-5.1"
permission_mode = "acceptEdits"
timeout_secs = 1800
supports_attachments = false
supports_streaming = true
supports_session_resume = true
