[package]
name = "velor-cli"
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
build = "build.rs"

[dependencies]
# Workspace dependencies
agent-client-protocol = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
color-eyre = { workspace = true }
jiff = { workspace = true }
diffy = { workspace = true }
dotenvy = { workspace = true }
ctrlc = { workspace = true }
crossterm = { workspace = true }
arboard = { workspace = true }
dirs = { workspace = true }
fs2 = { workspace = true }
humantime = { workspace = true }
ratatui = { workspace = true }
syntect = { workspace = true }
tui-markdown = { workspace = true }
unicode-width = { workspace = true }
reqwest = { workspace = true }
infer = { workspace = true }
tree-sitter = { workspace = true }
tree-sitter-highlight = { workspace = true }
tree-sitter-svelte-ng = { workspace = true }
tree-sitter-typescript = { workspace = true }
tree-sitter-javascript = { workspace = true }
tree-sitter-css = { workspace = true }
tree-sitter-html = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
teloxide = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Velor core library
velor-core = { path = "../../crates/velor-core" }

# Automations crate dependency
velor-automations = { path = "../../crates/automations" }

# Vault crate dependency
velor-vault = { path = "../../crates/velor-vault" }
secrecy = { workspace = true }

# Secure password prompts for vault
rpassword = "7.3"
atty = "0.2"

# Timezone name detection (for rendering provider-supplied retry/reset
# times in the user's local zone in `auto` mode); the resolved IANA name
# feeds jiff::tz::TimeZone::get.
iana-time-zone = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
serial_test = "3.4.0"
tempfile = { workspace = true }
tokio = { workspace = true }
wiremock = { workspace = true }

[[bin]]
name = "vel"
path = "src/main.rs"
