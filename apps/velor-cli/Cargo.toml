license = "UNLICENSED"

[dependencies]
# Workspace dependencies
agent-client-protocol = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
color-eyre = { workspace = true }
ctrlc = { workspace = true }
