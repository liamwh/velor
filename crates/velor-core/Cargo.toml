[package]
name = "velor-core"
version = "0.1.0"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/liamwh/velor"

[dependencies]
# Workspace dependencies
agent-client-protocol = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
command-group = { workspace = true }
color-eyre = { workspace = true }
jiff = { workspace = true }
dotenvy = { workspace = true }
humantime = { workspace = true }
minijinja = { workspace = true }
reqwest = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
strip-ansi-escapes = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { version = "1", features = ["serde", "v4"] }

# Rules system dependencies
globset = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }

# File-edit transcript diffing (line-based, 3-context unified hunks).
diffy = { workspace = true }

# Prompt discovery dependencies
dirs = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
wiremock = { workspace = true }
serial_test = { workspace = true }

# Deterministic, network-free fixture agent used ONLY by this crate's integration
# tests. It is a `[[bin]]` (not a separate crate) because referencing a binary
# from another crate in a test requires the unstable `bindeps` feature on the
# current toolchain, and `CARGO_BIN_EXE_*` only resolves to a same-crate target.
# Source lives under `tests/fixtures/` to keep it out of `src/`.
#
# Product-surface note: this target is NOT a dependency of the `vel` CLI or the
# Tauri app and is never referenced by production code (verified by grep). It is
# only built by `cargo test`/`cargo build -p velor-core` and is not installed or
# distributed. velor-core is an internal, UNLICENSED crate and is not published,
# so the fixture does not ship on crates.io. If velor-core is ever made
# publishable, gate this behind `required-features` or move it out first.
[[bin]]
name = "velor-test-agent"
path = "tests/fixtures/velor_test_agent.rs"
