[package]
name = "velor-core"
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"

[dependencies]
# Workspace dependencies
agent-client-protocol = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
command-group = { workspace = true }
chrono = { workspace = true }
color-eyre = { workspace = true }
dotenvy = { workspace = true }
humantime = { workspace = true }
minijinja = { workspace = true }
reqwest = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
strip-ansi-escapes = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { version = "1", features = ["serde", "v4"] }

# Rules system dependencies
globset = { workspace = true }
regex = { workspace = true }

# Prompt discovery dependencies
dirs = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
wiremock = { workspace = true }
serial_test = { workspace = true }

# Deterministic, network-free fixture agent used by integration tests. It is a
# `[[bin]]` of this crate so tests can locate it via `CARGO_BIN_EXE_*` without
# the unstable `bindeps` feature. Source lives under `tests/fixtures/` to keep it
# out of `src/`.
[[bin]]
name = "velor-test-agent"
path = "tests/fixtures/velor_test_agent.rs"
