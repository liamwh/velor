[package]
name = "velor-agent-cli"
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"

[dependencies]
# ACP SDK - use current published version (0.9.x, NOT schema version 0.10.x)
agent-client-protocol = "0.9"
async-trait = "0.1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
color-eyre = "0.6"
ctrlc = "3.4"
crossterm = "0.28"
humantime = "2"
minijinja = { version = "2.3", features = ["debug"] }
ratatui = "0.29"
reqwest = { version = "0.12", features = ["json", "blocking"] }
secrecy = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strip-ansi-escapes = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "net", "fs", "signal", "macros", "sync"] }
toml = "0.8"
tracing = "0.1"
url = "2"

[dev-dependencies]
proptest = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6"

[[bin]]
name = "velor"
path = "src/main.rs"

[workspace.lints.rust]
missing_docs = { level = "warn", priority = 1 }

[workspace.lints.clippy]
unwrap_used = "deny"
