[workspace]
resolver = "2"
members = ["crates/*", "apps/velor-cli", "apps/velor/src-tauri"]

[workspace.lints.rust]
missing_docs = { level = "warn", priority = 1 }

[workspace.lints.clippy]
unwrap_used = "deny"

[workspace.dependencies]
# Shared dependencies
agent-client-protocol = "0.9"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
color-eyre = "0.6"
ctrlc = "3.4"
crossterm = "0.28"
humantime = "2"
minijinja = { version = "2.3", features = ["debug"] }
ratatui = "0.29"
reqwest = { version = "0.12", features = ["json", "blocking"] }
secrecy = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
strip-ansi-escapes = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "net", "fs", "signal", "macros", "sync", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

# Rules system dependencies
globset = "0.4"
regex = "1.10"

# Automation-specific dependencies
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono"] }
cron = "0.12"
tempfile = "3"
wiremock = "0.6"
proptest = "1"

# Tauri dependencies
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-build = { version = "2", features = [] }

# Note: dev-dependencies are specified per-crate, not at workspace level
