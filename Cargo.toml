[package]
name = "velor-agent-cli"
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"

[dependencies]
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
color-eyre = "0.6"
crossterm = "0.28"
minijinja = { version = "2.3", features = ["debug"] }
ratatui = "0.29"
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"

[dev-dependencies]
proptest = "1"
tempfile = "3"

[[bin]]
name = "velor"
path = "src/main.rs"

[workspace.lints.rust]
missing_docs = { level = "warn", priority = 1 }

[workspace.lints.clippy]
unwrap_used = "deny"
