[workspace]
resolver = "2"
members = ["crates/*", "apps/velor-cli", "apps/velor/src-tauri"]

[workspace.lints.rust]
missing_docs = { level = "warn", priority = 1 }

[workspace.lints.clippy]
unwrap_used = "deny"

[workspace.dependencies]
# Shared dependencies
agent-client-protocol = "0.9"
async-trait = "0.1"
bytes = "1"
# Process-group management for the agent execution supervisor (Unix + Windows).
command-group = { version = "1.0", features = ["with-tokio"] }
libc = "0.2"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
dotenvy = "0.15"
color-eyre = "0.6"
ctrlc = "3.4"
crossterm = "0.28"
humantime = "2"
minijinja = { version = "2.3", features = ["debug"] }
ratatui = "0.30"
reqwest = { version = "0.12", features = ["json", "blocking"] }
secrecy = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
strip-ansi-escapes = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "net", "fs", "signal", "macros", "sync", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
teloxide = { version = "0.13", default-features = false, features = ["rustls"] }
url = "2"
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
infer = "0.16"
# System clipboard access for the streaming TUI's transcript-copy keys.
arboard = "3"

# Rules system dependencies
globset = "0.4"
regex = "1.10"

# Automation-specific dependencies
dirs = "5"
diffy = "0.4"
fs2 = "0.4"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono"] }
syntect = "5"
tui-markdown = "0.3"
unicode-width = "0.2"
cron = "0.12"

# Tree-sitter: high-quality highlighting for composite languages (Svelte) that
# syntect's grammar engine cannot load (modern Svelte .sublime-syntax relies on
# `extends`/`meta_prepend`, which syntect 5.3 does not merge). Parsers vendor
# their C source and compile at build time via the `cc` crate; no runtime fetch.
tree-sitter = "0.26"
tree-sitter-highlight = "0.26"
# Svelte grammar (Svelte 5 runes aware); MIT; ships highlights/injections/locals.
tree-sitter-svelte-ng = "1.0.2"
# Embedded-language parsers for Svelte injections (script/style blocks).
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-css = "0.23"
tree-sitter-html = "0.23"
iana-time-zone = "0.1"
tempfile = "3"
wiremock = "0.6"
proptest = "1"
ulid = "1"

# Vault/crypto dependencies
chacha20poly1305 = "0.10"
rand = "0.8"
sha2 = "0.10"
argon2 = "0.5"
zeroize = { version = "1", features = ["zeroize_derive"] }
thiserror = "2.0"
serial_test = "3"

# Tauri dependencies
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-build = { version = "2", features = [] }

# Note: dev-dependencies are specified per-crate, not at workspace level
